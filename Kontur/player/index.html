<!doctype html>
<title>Kontur Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Редактор: инструменты слева, холст в центре, панели справа, таймлайн внизу. Тёмная тема — осознанно единственная. */
:root {
  --ink: #0e1017;        /* фон приложения */
  --panel: #151823;      /* панели */
  --raise: #1d2130;      /* поля, кнопки */
  --line: #2a2f42;       /* разделители */
  --text: #e4e6f0;
  --mute: #8a90a8;
  --accent: #9ea8ff;     /* выделение, плейхед */
  --key: #ffc46b;        /* ключевые кадры */
  --mod: #6fe0c4;        /* модификаторы */
  --rec: #ff6b6b;        /* автоключ, запись состояния */
  --bad: #ff8a8a;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; margin: 0 }
body { background: var(--ink); color: var(--text); font: 13px/1.45 var(--sans); overflow: hidden }
button, select, textarea, input { font: inherit; color: inherit }
button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer }
button:hover:not(:disabled) { border-color: var(--accent) }
button:disabled { opacity: .45; cursor: default }
button.on { background: #2b3156; border-color: var(--accent) }
button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
select, input[type=text], input[type=number], input:not([type]) { background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 3px 6px; min-width: 0 }
input[type=color] { width: 26px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer }
input[type=checkbox] { accent-color: var(--accent) }
.note { color: var(--mute); font-size: 12px }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.spacer { flex: 1 }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 44px 1fr 330px; grid-template-areas: "top top top" "tools stage side" "time time time" }
header { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-width: 0 }
.brand { font-weight: 600; letter-spacing: .02em; display: flex; align-items: center; gap: 8px }
.brand small { color: var(--mute); font-weight: 400; font-family: var(--mono); font-size: 11px }
#pick { max-width: 280px }
.live { font-family: var(--mono); font-size: 11px; color: var(--mute); display: flex; align-items: center; gap: 6px; white-space: nowrap }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--mute); flex: none }
.live.on i { background: var(--mod); box-shadow: 0 0 8px var(--mod) }
.live.busy i { background: var(--key) }
.edits { font-size: 12px; color: var(--mute); display: flex; gap: 6px; align-items: center }
.edits b { color: var(--key); font-weight: 500 }
.edits .warn { color: var(--bad); cursor: help }

/* панель инструментов */
.tools { grid-area: tools; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; overflow-y: auto }
.tools button { width: 34px; height: 32px; padding: 0; display: grid; place-items: center; border-color: transparent; background: none }
.tools button.on { background: #2b3156; border-color: var(--accent) }
.tools button svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round }
.tools hr { width: 26px; border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.swatches { position: relative; width: 34px; height: 38px; margin-top: 4px }
.swatches input { position: absolute; width: 22px; height: 22px }
.swatches #fillc { left: 2px; top: 2px; z-index: 1 }
.swatches #strokec { left: 12px; top: 14px }

/* холст */
.stage { grid-area: stage; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: repeating-conic-gradient(#12141d 0 25%, #10121a 0 50%) 0 0 / 22px 22px; touch-action: none; outline: none }
#canvas { position: absolute; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
#canvas.ghost { opacity: 0 }
#pv { position: absolute; pointer-events: none; display: none }
#pv.pixel { image-rendering: pixelated }
#ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible }
#ov .hit { pointer-events: all }
.viewbar { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; align-items: center; background: rgba(21,24,35,.92); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: 12px }
.viewbar button { padding: 2px 7px; font-size: 12px }
.viewbar .z { font-family: var(--mono); min-width: 48px; text-align: center; color: var(--mute) }
.status { position: absolute; left: 10px; bottom: 10px; font-family: var(--mono); font-size: 11px; color: var(--mute); background: rgba(21,24,35,.85); padding: 3px 7px; border-radius: 6px; pointer-events: none }
.banner { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: #3a1d22; border: 1px solid var(--rec); color: #ffd0d0; padding: 4px 6px 4px 12px; border-radius: 8px; display: flex; gap: 10px; align-items: center; font-size: 12px; z-index: 2 }
.banner.scope { background: #1f2440; border-color: var(--accent); color: var(--text) }
.banner.expr { background: #3a3014; border-color: #c9a227; color: #ffe9a8 }
.err { position: absolute; left: 12px; right: 12px; top: 12px; background: #2a1518; border: 1px solid var(--bad); color: var(--bad); padding: 8px 10px; border-radius: 6px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; z-index: 3 }
#toast { position: fixed; left: 50%; bottom: 210px; transform: translateX(-50%); background: #23283c; border: 1px solid var(--line); padding: 7px 14px; border-radius: 8px; z-index: 50; max-width: 70vw; box-shadow: 0 8px 30px rgba(0,0,0,.4) }
#toast.bad { border-color: var(--bad); color: #ffd6d6 }

/* правая панель */
aside { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0 }
.tabs { display: flex; border-bottom: 1px solid var(--line) }
.tabs button { flex: 1; border: 0; border-radius: 0; background: none; padding: 8px 4px; color: var(--mute); border-bottom: 2px solid transparent }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent) }
.pane { flex: 1; overflow: auto; min-height: 0 }
.split { display: flex; flex-direction: column; min-height: 0; flex: 1 }
.split > .layers-wrap { flex: 0 0 42%; overflow: auto; border-bottom: 1px solid var(--line); min-height: 80px }
.split > .insp-wrap { flex: 1; overflow: auto; min-height: 0 }
.ltools { display: flex; gap: 3px; padding: 5px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 1 }
.ltools button { padding: 1px 6px; font-size: 12px }
.layers { list-style: none; margin: 0; padding: 2px 0 8px }
.layers li { display: flex; align-items: center; gap: 4px; padding: 2px 6px; cursor: default; white-space: nowrap; border-top: 1px solid transparent; border-bottom: 1px solid transparent; user-select: none }
.layers li:hover { background: var(--raise) }
.layers li.sel { background: #262b45 }
.layers li.scope { box-shadow: inset 2px 0 var(--accent) }
.layers li.dim .nm { opacity: .45 }
.layers li.drop-before { border-top-color: var(--accent) }
.layers li.drop-after { border-bottom-color: var(--accent) }
.layers li.drop-in { background: #2b3156 }
.layers .car { width: 14px; text-align: center; color: var(--mute); cursor: pointer; flex: none; font-size: 10px }
.layers .ty { font-family: var(--mono); font-size: 9.5px; color: var(--mute); width: 30px; flex: none; overflow: hidden }
.layers .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0 }
.layers .nm input { width: 100%; padding: 0 4px }
.layers .badge { font-family: var(--mono); font-size: 9.5px; padding: 0 4px; border-radius: 4px; border: 1px solid; flex: none }
.badge.k { color: var(--key); border-color: #5c4a2c }
.badge.m { color: var(--mod); border-color: #2c5248 }
.badge.s { color: #d6a2ff; border-color: #4a3560 }
.badge.b { color: var(--accent); border-color: #39406a }
.layers .ic { width: 18px; text-align: center; color: var(--mute); cursor: pointer; flex: none; opacity: 0; font-size: 11px }
.layers li:hover .ic, .layers .ic.set { opacity: 1 }
.layers .ic.set { color: var(--text) }

.inspect { padding: 8px 10px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px }
.inspect h3 { margin: 2px 0 2px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center }
.inspect h3 input { flex: 1; font-weight: 600 }
.inspect h4 { margin: 8px 0 1px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--mute); font-weight: 500; display: flex; gap: 6px; align-items: center }
.fld { display: grid; grid-template-columns: 14px 86px 1fr; gap: 4px; align-items: center; min-height: 24px }
.fld > label { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.fld > label.scrub { cursor: ew-resize }
.fld .ctl { display: flex; gap: 4px; align-items: center; min-width: 0 }
.fld .ctl > input:not([type=color]):not([type=checkbox]), .fld .ctl > select, .fld .ctl > textarea { flex: 1; width: 100% }
.fld.st > label { color: #d6a2ff }
.fld textarea { min-height: 54px; resize: vertical; background: var(--raise); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; font: 12px/1.4 var(--mono) }
.kd { width: 12px; height: 12px; border: 0; padding: 0; background: none; cursor: pointer; position: relative }
.kd::before { content: ""; position: absolute; inset: 2px; transform: rotate(45deg); border: 1.5px solid #4c4f63; border-radius: 1px }
.kd.keyed::before { border-color: var(--key) }
.kd.on::before { background: var(--key); border-color: var(--key) }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 8px }
.pair .fld { grid-template-columns: 14px minmax(0, max-content) minmax(54px, 1fr) }
.stage:focus-visible { outline: none }
.empty { color: var(--mute); padding: 14px 12px }
.btns { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px }
.btns button { font-size: 12px; padding: 2px 8px }
.warnlist { color: var(--bad); font-size: 12px; margin: 2px 0; padding-left: 16px }
.chip { display: inline-flex; gap: 4px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 1px 4px 1px 9px; margin: 2px 3px 2px 0; font-size: 12px; background: var(--raise); cursor: pointer }
.chip.cur { border-color: var(--accent); background: #2b3156 }
.chip .rec { width: 16px; height: 16px; border-radius: 50%; border: 0; padding: 0; background: none; color: var(--mute); font-size: 10px }
.chip .rec.on { color: var(--rec) }
.grp { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 4px 0 }
.jsonpane { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 8px }
.jsonpane textarea { flex: 1; min-height: 200px; width: 100%; resize: none; background: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 11.5px/1.5 var(--mono); tab-size: 1 }

/* таймлайн */
.timeline { grid-area: time; background: var(--panel); border-top: 1px solid var(--line); padding: 6px max(12px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); user-select: none }
.transport { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap }
.play { width: 32px; height: 26px; padding: 0; display: grid; place-items: center }
.clock { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; width: 64px }
#autokey.on { background: #3a1d22; border-color: var(--rec); color: #ffd0d0 }
#autokey i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); margin-right: 5px }
#autokey.on i { background: var(--rec) }
.tracks { position: relative; display: grid; grid-template-columns: 150px 1fr; row-gap: 2px }
.tracks .lbl { font-family: var(--mono); font-size: 11px; color: var(--mute); height: 18px; line-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; cursor: default }
.tracks .lbl.node { color: var(--text) }
.lane { position: relative; height: 18px; background: var(--ink); border-radius: 3px; cursor: crosshair }
.lane.ruler { background: none; height: 32px; border-bottom: 1px solid var(--line); border-radius: 0 }
.tick { position: absolute; bottom: 0; width: 1px; height: 4px; background: var(--line); pointer-events: none }
.tick span { position: absolute; bottom: 14px; left: 3px; font-family: var(--mono); font-size: 10px; color: var(--mute) }
.kf { position: absolute; top: 4px; width: 10px; height: 10px; margin-left: -5px; background: var(--key); transform: rotate(45deg); border-radius: 1px; cursor: ew-resize }
.kf.hold { transform: none; border-radius: 0; width: 9px; height: 9px; margin-left: -4.5px; top: 4.5px }
.kf.lin { background: #ffe0a8 }
.kf.sel { outline: 2px solid var(--accent); outline-offset: 1px }
.kf.sum { background: #c79a52 }
.cliprange { position: absolute; top: 18px; height: 12px; border-radius: 2px; background: rgba(158,168,255,.18); border: 1px solid rgba(158,168,255,.45); font-family: var(--mono); font-size: 9px; line-height: 10px; color: var(--accent); padding: 0 6px; overflow: hidden; white-space: nowrap; cursor: grab }
.cliprange.on { background: rgba(158,168,255,.42); color: var(--text) }
.cliprange .eg { position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize }
.modbar { position: absolute; top: 7px; height: 4px; background: var(--mod); opacity: .55; border-radius: 2px; pointer-events: none }
.seg { position: absolute; top: 8px; height: 2px; background: #6a5735; pointer-events: none }
.head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); pointer-events: none; z-index: 1 }
.tracks-scroll { max-height: 160px; overflow-y: auto; overflow-x: hidden }
.menu { position: fixed; z-index: 60; background: #1b1f2e; border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-height: 60vh; overflow: auto; min-width: 160px }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 10px; font-size: 12px }
.menu button:hover { background: var(--raise) }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 3px 0 }

@media (max-width: 860px) {
  .app { grid-template-columns: 44px 1fr; grid-template-rows: auto minmax(260px, 55vh) auto 1fr; grid-template-areas: "top top" "tools stage" "time time" "side side"; overflow: auto }
  body { overflow: auto }
  aside { border-left: 0; border-top: 1px solid var(--line); min-height: 360px }
  .tracks { grid-template-columns: 96px 1fr }
}
@media (prefers-reduced-motion: reduce) { .live.on i { box-shadow: none } }
</style>

<div class="app">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 11C3 5 8 3 11 3s8 3 8 8-4 8-8 8-8-3-8-8Z" fill="none" stroke="#9ea8ff" stroke-width="2"/><path d="M7 15 15 7" stroke="#ffc46b" stroke-width="2" stroke-linecap="round"/></svg>
      Kontur <small id="ver"></small>
    </div>
    <select id="pick" aria-label="Сцена"></select>
    <button id="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">↶</button>
    <button id="redo" title="Повторить (Ctrl+Shift+Z)" aria-label="Повторить">↷</button>
    <div class="edits" id="edits"></div>
    <div class="spacer"></div>
    <button id="download" title="Скачать сцену JSON (Ctrl+S без сервера)">Скачать JSON</button>
    <div class="live" id="live" title="Соединение с MCP-сервером"><i></i><span>автономно</span></div>
  </header>

  <nav class="tools" id="tools" aria-label="Инструменты"></nav>

  <main class="stage" id="stage" tabindex="0" aria-label="Холст сцены">
    <div id="canvas" role="img" aria-label="Кадр сцены"></div>
    <canvas id="pv"></canvas>
    <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="banner" id="banner" hidden></div>
    <div class="err" id="err" hidden></div>
    <div class="status" id="status"></div>
    <div class="viewbar">
      <button id="v-bones" title="Показывать кости, цели IK и свет">Кости</button>
      <button id="v-snap" title="Привязка к краям и центрам объектов (Ctrl при перетаскивании — без привязки)">Привязка</button>
      <button id="v-pixel" title="Пиксельное превью: кадр в низком разрешении без сглаживания">Пиксели</button>
      <button id="v-light" title="Превью света: источники light по карте высот, как 2D-свет в Godot">Свет</button>
      <button id="v-deferred" title="Отложенный свет 2.5D-сцены (camera3d + surface): солнце с тенями, AO, фонари, блики, туман и стиль — считается сервером">Отложенный свет</button>
      <button id="v-canvas" title="Рисовать кадр на Canvas 2D вместо SVG (быстрее на больших сценах; маски и паттерны — через SVG-откат)">Canvas</button>
      <button id="v-fit" title="Вписать (Ctrl+0)">Вписать</button>
      <span class="z" id="zoom">100%</span>
    </div>
  </main>

  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-edit" aria-selected="true">Объекты</button>
      <button role="tab" id="tab-scene" aria-selected="false">Сцена</button>
      <button role="tab" id="tab-json" aria-selected="false">JSON</button>
    </div>
    <div class="split" id="pane-edit">
      <div class="layers-wrap">
        <div class="ltools">
          <button id="l-group" title="Сгруппировать (Ctrl+G)">Группа</button>
          <button id="l-ungroup" title="Разгруппировать (Ctrl+Shift+G)">Разгр.</button>
          <button id="l-dup" title="Дублировать (Ctrl+D)">Дубль</button>
          <button id="l-del" title="Удалить (Del)">Удалить</button>
          <span class="spacer"></span>
          <button id="l-up" title="Выше (Ctrl+])">▲</button>
          <button id="l-down" title="Ниже (Ctrl+[)">▼</button>
        </div>
        <ul class="layers" id="layers"></ul>
      </div>
      <div class="insp-wrap"><div class="inspect" id="inspect"></div></div>
    </div>
    <div class="pane" id="pane-scene" hidden><div class="inspect" id="scenepanel"></div></div>
    <div class="pane" id="pane-json" hidden>
      <div class="jsonpane">
        <textarea id="json" spellcheck="false" aria-label="JSON сцены"></textarea>
        <div class="row">
          <button id="apply">Применить</button>
          <span class="note" id="jsonmsg">Правка JSON целиком заменяет сцену (с отменой).</span>
        </div>
      </div>
    </div>
  </aside>

  <section class="timeline" id="timeline">
    <div class="transport">
      <button class="play" id="play" aria-label="Воспроизвести">▶</button>
      <input class="clock" id="clock" aria-label="Время, с" value="0.00">
      <span class="note" id="dur"></span>
      <select id="clip" aria-label="Клип"><option value="">Вся шкала</option></select>
      <button id="addclip" title="Новый клип от плейхеда">+ клип</button>
      <select id="speed" aria-label="Скорость"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      <label class="row note"><input type="checkbox" id="loop" checked> Повтор</label>
      <button id="autokey" title="Автоключ: любое изменение на холсте и в свойствах ставит ключ в момент плейхеда"><i></i>Автоключ</button>
      <span class="spacer"></span>
      <span class="note" id="tlhint"></span>
    </div>
    <div class="tracks-scroll">
      <div class="tracks" id="tracks"></div>
    </div>
  </section>
</div>
<div id="toast" hidden></div>

<script type="module">
// Модули редактора лежат в player/ed/; автономная сборка (scripts/build-artifact.mjs) склеивает их сюда.
import './ed/app.js';
</script>
